<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche Pure Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <p class="hint infobox" data-t="infoBannerHtml"></p>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="log-opt">
      <span data-t="showallLabel"></span>
      <input type="checkbox" id="showall">
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-act="connect"></button>
    </div>
    <div class="set-row">
      <label data-t="lblPin"></label>
      <input id="pin-in" type="text" inputmode="numeric" maxlength="12" data-t-ph="pinPh" data-conn disabled>
      <button id="btn-pin" data-t="btnPin" data-conn disabled></button>
    </div>
    <p class="hint" data-t="pinHint"></p>
    <p class="hint" id="auth-current"></p>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card" id="live-card" hidden>
    <div class="card-head"><h2 data-t="liveTitle"></h2><button type="button" class="help-btn" data-help="live" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile"><b id="t-devtype">-</b><small data-t="tileDevType"></small></div>
      <div class="tile"><b id="t-auth">-</b><small data-t="tileAuth"></small></div>
      <div class="tile"><b id="t-drivemode">-</b><small data-t="tileDriveMode"></small></div>
      <div class="tile"><b id="t-nfc">-</b><small data-t="tileNfc"></small></div>
      <div class="tile"><b id="t-voice">-</b><small data-t="tileVoice"></small></div>
      <div class="tile"><b id="t-ludo">-</b><small data-t="tileLudo"></small></div>
      <div class="tile"><b id="t-speed">-</b><small data-t="tileSpeed"></small></div>
      <div class="tile"><b id="t-gearpos">-</b><small data-t="tileGearPos"></small></div>
      <div class="tile"><b id="t-esctemp">-</b><small data-t="tileEscTemp"></small></div>
      <div class="tile"><b id="t-motortemp">-</b><small data-t="tileMotorTemp"></small></div>
      <div class="tile"><b id="t-trip">-</b><small data-t="tileTrip"></small></div>
      <div class="tile"><b id="t-total">-</b><small data-t="tileTotal"></small></div>
      <div class="tile"><b id="t-version">-</b><small data-t="tileVersion"></small></div>
      <div class="tile"><b id="t-lim-eco">-</b><small data-t="tileLimEco"></small></div>
      <div class="tile"><b id="t-lim-comfort">-</b><small data-t="tileLimComfort"></small></div>
      <div class="tile"><b id="t-lim-sport">-</b><small data-t="tileLimSport"></small></div>
      <div class="tile"><b id="t-lim-cruise">-</b><small data-t="tileLimCruise"></small></div>
      <div class="tile"><b id="t-rxframes">-</b><small data-t="tileRxFrames"></small></div>
    </div>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card" id="batt-card" hidden>
    <div class="card-head"><h2 data-t="battTitle"></h2><button type="button" class="help-btn" data-help="batt" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile"><b id="t-batt-soc">-</b><small data-t="tileBattSoc"></small></div>
      <div class="tile"><b id="t-batt-volt">-</b><small data-t="tileBattVolt"></small></div>
      <div class="tile"><b id="t-batt-curr">-</b><small data-t="tileBattCurr"></small></div>
      <div class="tile"><b id="t-batt-power">-</b><small data-t="tileBattPower"></small></div>
    </div>
    <p class="hint" data-t="battHint"></p>
  </div>

  <div class="card" id="more-card" hidden>
    <div class="card-head"><h2 data-t="moreTitle"></h2><button type="button" class="help-btn" data-help="more" aria-label="Info">?</button></div>
    <p class="hint" data-t="moreHint"></p>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <div class="btns">
      <button class="primary span2" id="btn-toggle" data-conn disabled></button>
    </div>
    <div class="speed-values">
      <div class="sv"><label data-t="lblOpen"></label><input id="speed-in" type="number" step="1" min="1" max="60" value="40" data-conn disabled></div>
      <div class="sv"><label data-t="lblEkfv"></label><input id="ekfv-in" type="number" step="1" min="1" max="60" value="20" data-conn disabled></div>
    </div>
    <p class="hint" data-t="speedValuesHint"></p>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <div class="set-row">
      <label class="set-label"><span data-t="set_drivemode"></span></label>
      <select id="drivemode-in" data-conn disabled>
        <option value="0" data-t="valSingle"></option>
        <option value="1" data-t="valDual"></option>
      </select>
      <button type="button" id="btn-drivemode" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_gear"></span></label>
      <select id="gear-in" data-conn disabled>
        <option value="0" data-t="gear1"></option>
        <option value="1" data-t="gear2"></option>
        <option value="2" data-t="gear3"></option>
        <option value="3" data-t="gear4"></option>
      </select>
      <button type="button" id="btn-gear" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_cruise"></span></label>
      <select id="cruise-in" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-cruise" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_zerostart"></span></label>
      <select id="zerostart-in" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-zerostart" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_light"></span></label>
      <select id="light-in" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-light" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_atmos"></span></label>
      <select id="atmos-in" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-atmos" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_unit"></span></label>
      <select id="unit-in" data-conn disabled>
        <option value="0" data-t="optKm"></option>
        <option value="1" data-t="optMi"></option>
      </select>
      <button type="button" id="btn-unit" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_nfc"></span></label>
      <select id="nfc-in" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-nfc" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_voice"></span></label>
      <select id="voice-in" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-voice" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_ludo"></span></label>
      <select id="ludo-in" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-ludo" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_lock"></span></label>
      <select id="lock-in" data-conn disabled>
        <option value="0" data-t="lockOff"></option>
        <option value="1" data-t="lockOn"></option>
      </select>
      <button type="button" id="btn-lock" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_wheel"></span></label>
      <select id="wheel-in" data-conn disabled>
        <option value="0" data-t="wheel85"></option>
        <option value="1" data-t="wheel10"></option>
        <option value="2" data-t="wheel11"></option>
      </select>
      <button type="button" id="btn-wheel" data-t="btnSend" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="set_moddepth"></span></label>
      <select id="moddepth-in" data-conn disabled>
        <option value="0" data-t="mod30"></option>
        <option value="1" data-t="mod40"></option>
        <option value="2" data-t="mod50"></option>
      </select>
      <button type="button" id="btn-moddepth" data-t="btnSend" data-conn disabled></button>
    </div>
  </div>

  <div class="card" id="raw-card" hidden>
    <div class="card-head"><h2 data-t="rawTitle"></h2><button type="button" class="help-btn" data-help="raw" aria-label="Info">?</button></div>
    <p class="hint" data-t="rawHint"></p>

    <h3 class="set-group" data-t="grp_register"></h3>
    <div class="set-row">
      <label class="set-label"><span data-t="lblRegAddr"></span></label>
      <input id="reg-addr-in" type="number" min="0" max="65535" step="1" data-t-ph="regAddrPh" data-conn disabled>
      <button type="button" id="btn-reg-read" data-t="btnRead" data-conn disabled></button>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="lblRegValues"></span></label>
      <input id="reg-values-in" type="text" data-t-ph="regValuesPh" data-conn disabled>
      <button type="button" id="btn-reg-write" data-t="btnSend" data-conn disabled></button>
    </div>
    <p class="hint" data-t="regHint"></p>

    <h3 class="set-group" data-t="grp_rawframe"></h3>
    <div class="set-row">
      <label class="set-label"><span data-t="lblRawChan"></span></label>
      <select id="raw-chan" data-conn disabled>
        <option value="data">DATA (F1F1)</option>
        <option value="cmd">CMD (F2F1)</option>
      </select>
      <span></span>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="lblRaw"></span></label>
      <input id="raw-in" type="text" data-t-ph="rawPh" data-conn disabled>
      <button type="button" id="btn-raw" data-t="btnSend" data-conn disabled></button>
    </div>

    <h3 class="set-group" data-t="grp_buildframe"></h3>
    <div class="set-row">
      <label class="set-label"><span data-t="lblFreeOp"></span></label>
      <input id="free-op" type="text" maxlength="2" data-t-ph="freeOpPh" data-conn disabled>
      <span></span>
    </div>
    <div class="set-row">
      <label class="set-label"><span data-t="lblFreePayload"></span></label>
      <input id="free-payload" type="text" data-t-ph="freePayloadPh" data-conn disabled>
      <button type="button" id="btn-free" data-t="btnSend" data-conn disabled></button>
    </div>

    <h3 class="set-group" data-t="grp_atline"></h3>
    <div class="set-row">
      <label class="set-label"><span data-t="lblAt"></span></label>
      <input id="at-in" type="text" data-t-ph="atPh" data-conn disabled>
      <button type="button" id="btn-at" data-t="btnSend" data-conn disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="Info">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="Info">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/pure-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="DISCLAIMER.de.md" data-doc="DISCLAIMER" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="doc-head">
    <h3 id="confirm-title" data-t="confirmTitle"></h3>
    <button type="button" id="confirm-x">&times;</button>
  </div>
  <div class="doc-body"><p id="confirm-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="confirm-no" data-t="confirmCancel"></button>
    <button type="button" id="confirm-ok" class="primary" data-t="confirmOk"></button>
  </div>
</dialog>

<script src="report-footer.js?v=6"></script>
<script src="i18n.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
